services:
  - type: web
    name: krishi
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: LLM_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: FRONTEND_ORIGIN
        value: https://krishii.onrender.com
